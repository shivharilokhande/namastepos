pluginManagement {
    def flutterSdkPath = {
        def localPropsFile = file("local.properties")
        def sdk = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")

        if (localPropsFile.exists()) {
            def properties = new Properties()
            localPropsFile.withInputStream { properties.load(it) }
            def fromProps = properties.getProperty("flutter.sdk")
            if (fromProps != null && !fromProps.isEmpty()) {
                sdk = fromProps
            }
        }

        if (sdk == null || sdk.isEmpty()) {
            throw new GradleException(
                "Flutter SDK location not found.\n\n" +
                "Run this from the project root:\n" +
                "    flutter create . --org in.namastepos --platforms=android,ios\n\n" +
                "...or create 'android/local.properties' with:\n" +
                "    sdk.dir=/path/to/Android/Sdk\n" +
                "    flutter.sdk=/path/to/flutter\n"
            )
        }
        return sdk
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    // FCM (2026-08-26): processes android/app/google-services.json.
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
