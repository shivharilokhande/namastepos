version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React 18
  - Vite
  - React Router
  - "@tanstack/react-query"
  - axios
  - Tailwind CSS
  - shadcn/ui
  - recharts
  - qrcode.react
  - sonner (toasts)
  - PostgreSQL backend at /v1
  - Razorpay Checkout JS
features:
  - name: Authentication
    description: Email/password + Google sign-in for the business owner, with JWT + refresh token persisted to localStorage and an axios interceptor that auto-refreshes on 401.
    files:
      - src/pages/LoginPage.tsx
      - src/pages/RegisterPage.tsx
      - src/api/client.ts
      - src/api/namastepos.ts
    endpoints:
      - method: POST
        path: /v1/auth/login
        description: Email + password login
        auth_required: false
        request_schema:
          body:
            email: string
            password: string
        response_schema:
          "200": "{ token, refreshToken, user, business, plan, role }"
          "401": INVALID_CREDENTIALS
      - method: POST
        path: /v1/auth/google
        description: Google ID token exchange
        auth_required: false
      - method: GET
        path: /v1/auth/me
        description: Current owner profile + tier_kind features
        auth_required: true
        response_schema:
          "200": "{ user, business, plan: { tierKind, features[] } }"
    depends_on: []
  - name: Menu management
    description: List, create, edit, delete menu items grouped by category. Each item has price, stock, gst_pct, hsn_code, variants, modifier groups.
    files:
      - src/pages/MenuPage.tsx
    endpoints:
      - method: GET
        path: /v1/businesses/:bid/menu
        description: List active menu items
        auth_required: true
      - method: POST
        path: /v1/businesses/:bid/menu
        description: Create menu item
        auth_required: true
      - method: PUT
        path: /v1/businesses/:bid/menu/:id
        description: Update menu item
        auth_required: true
    depends_on:
      - Authentication
  - name: Orders + POS
    description: Take new orders via POS dialog, see live order list, change status (pending -> ready -> collected -> cancelled). Auto-issues a tax invoice when an order is collected.
    files:
      - src/pages/OrdersPage.tsx
      - src/components/NewOrderDialog.tsx
    endpoints:
      - method: GET
        path: /v1/businesses/:bid/orders
        description: List orders
        auth_required: true
      - method: POST
        path: /v1/businesses/:bid/orders
        description: Create order
        auth_required: true
      - method: PUT
        path: /v1/businesses/:bid/orders/:id/status
        description: Change order status (auto-issues tax invoice on collect)
        auth_required: true
    depends_on:
      - Authentication
      - Menu management
  - name: Reports - P&L statement
    description: Schedule III-style profit & loss for a date range. Includes revenue from operations, COGS, operating expenses by category, EBITDA, net profit, plus a memorandum of GST collected. Exportable to PDF/XLSX/CSV.
    files:
      - src/pages/ReportsPage.tsx
    endpoints:
      - method: GET
        path: /v1/businesses/:bid/reports/income-statement
        description: JSON P&L payload
        auth_required: true
        request_schema:
          query:
            startDate: "YYYY-MM-DD"
            endDate: "YYYY-MM-DD"
      - method: GET
        path: /v1/businesses/:bid/reports/income-statement.pdf
        description: PDF export of the P&L
        auth_required: true
      - method: GET
        path: /v1/businesses/:bid/reports/income-statement.xlsx
        description: Excel workbook export
        auth_required: true
      - method: GET
        path: /v1/businesses/:bid/reports/income-statement.csv
        description: CSV export
        auth_required: true
    depends_on:
      - Authentication
  - name: Reports - Income / Expense / Invoice registers
    description: Transaction-level detail registers for GST audit cross-check. Income register lists every non-cancelled order; expense register lists every expense with by-category summary; invoice register lists every tax invoice issued.
    files:
      - src/pages/ReportsPage.tsx
    endpoints:
      - method: GET
        path: /v1/businesses/:bid/reports/income-register
        auth_required: true
      - method: GET
        path: /v1/businesses/:bid/reports/expense-register
        auth_required: true
      - method: GET
        path: /v1/businesses/:bid/reports/invoice-register
        auth_required: true
      - method: GET
        path: /v1/businesses/:bid/reports/{income,expense,invoice}-register.{pdf,xlsx,csv}
        description: Each register has PDF/XLSX/CSV export endpoints
        auth_required: true
    depends_on:
      - Authentication
  - name: Tax invoices (GST Rule 46)
    description: Customer-facing GST tax invoices, auto-issued when an order is collected. FY-sequential invoice numbers, supplier + recipient details, line items with HSN, CGST/SGST/IGST split, amount-in-words, downloadable PDF + print preview.
    files:
      - src/pages/InvoicesPage.tsx
    endpoints:
      - method: GET
        path: /v1/businesses/:bid/tax-invoices
        auth_required: true
      - method: POST
        path: /v1/businesses/:bid/tax-invoices
        description: Manually issue (idempotent — returns existing if already issued for the order)
        auth_required: true
      - method: GET
        path: /v1/businesses/:bid/tax-invoices/:id
        auth_required: true
      - method: GET
        path: /v1/businesses/:bid/tax-invoices/:id/pdf
        description: Rule 46 compliant PDF for print/download
        auth_required: true
      - method: POST
        path: /v1/businesses/:bid/tax-invoices/:id/cancel
        description: Owner-only cancellation with reason
        auth_required: true
    depends_on:
      - Authentication
      - Orders + POS
  - name: QR codes
    description: One QR per table, JWT-signed token, customer scans -> opens guest menu URL -> orders without a waiter. PNG download for printing on table tents. Backend self-heals if migration 007 was skipped (auto-adds qr_token TEXT column, widens VARCHAR(255) to TEXT if needed, adopts orphan JWTs).
    files:
      - src/pages/QrCodesPage.tsx
      - src/pages/GuestMenuPage.tsx
    endpoints:
      - method: GET
        path: /v1/businesses/:bid/ops/tables/:tableId/qr
        description: Returns the persistent JWT for the table
        auth_required: true
      - method: POST
        path: /v1/businesses/:bid/ops/tables/:tableId/qr/rotate
        description: Invalidates the old QR
        auth_required: true
      - method: GET
        path: /v1/guest/menu/:token
        description: Public guest menu (no auth)
        auth_required: false
      - method: POST
        path: /v1/guest/orders/:token
        description: Public order placement
        auth_required: false
    depends_on:
      - Authentication
      - Menu management
  - name: Staff (PIN-based)
    description: Owner adds staff with role (Manager / Captain / Waiter / Cashier / Kitchen), phone, 4-digit PIN, and per-staff permission overrides. Over-limit banner appears when active non-owner staff exceeds plan.limits.staff, with one-click "Comply now" to deactivate the newest hires.
    files:
      - src/pages/StaffPage.tsx
    endpoints:
      - method: GET
        path: /v1/businesses/:bid/staff/pin
        auth_required: true
      - method: POST
        path: /v1/businesses/:bid/staff/pin
        description: Create staff with PIN (rejected with 402 if over plan cap)
        auth_required: true
      - method: PUT
        path: /v1/businesses/:bid/staff/pin/:userId
        description: Update name / role / phone / PIN / permissions / isActive
        auth_required: true
      - method: POST
        path: /v1/businesses/:bid/staff/pin/comply-limit
        description: Auto-deactivate excess non-owner staff (keeps earliest joined N)
        auth_required: true
    depends_on:
      - Authentication
  - name: Billing
    description: Plan compare cards driven by the live /plans endpoint (enriched with featureKeys from plan_features matrix). Owner can switch plans via Razorpay Checkout. Subscription invoices listed separately from tax invoices.
    files:
      - src/pages/BillingPage.tsx
    endpoints:
      - method: GET
        path: /v1/plans
        description: All plans with featureKeys + limits
        auth_required: true
      - method: GET
        path: /v1/businesses/:bid/billing
        description: Current subscription
        auth_required: true
      - method: POST
        path: /v1/businesses/:bid/billing/change
        description: Switch plan (kicks off Razorpay Checkout for paid plans)
        auth_required: true
      - method: GET
        path: /v1/businesses/:bid/billing/invoices
        description: SaaS subscription invoices (NOT tax invoices)
        auth_required: true
    depends_on:
      - Authentication
known_limitations:
  - issue: Free-tier TestSprite has 150 credits — limit test plan to ~10-15 high-value cases.
    location: account.plan
    impact: Cannot exhaustively test every feature in a single run.
  - issue: Some legacy types reference pre-Push-15 `tier` enum (free/basic/pro) alongside the new `tier_kind` (starter/pro/enterprise). UI maps between them but some test assertions may need both forms.
    location: src/api/namastepos.ts and src/api/admin.ts
    impact: Test cases that assert tier names should accept either vocabulary.
  - issue: Razorpay Checkout opens a third-party iframe — most plan-switch happy paths cannot complete without a real card swipe.
    location: src/pages/BillingPage.tsx
    impact: Plan-switch tests should stop after the checkout iframe loads (don't try to drive Razorpay's UI).
