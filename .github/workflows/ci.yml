name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  # Lets you demand a full signed release build on any branch, on demand —
  # see the `if:` on the APK steps in the mobile job.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: namastepos
          POSTGRES_PASSWORD: namastepos
          POSTGRES_DB: namastepos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U namastepos"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://namastepos:namastepos@localhost:5432/namastepos_test
      JWT_SECRET: ci-secret-do-not-deploy
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: namastepos_backend/package-lock.json }

      - name: Install backend
        working-directory: namastepos_backend
        run: npm ci

      - name: Migration test (forward + re-run)
        working-directory: namastepos_backend
        run: |
          export PGPASSWORD=namastepos
          export MIGRATION_TEST_DB=namastepos_migrationtest
          createdb -h localhost -U namastepos "$MIGRATION_TEST_DB"
          for f in db/migrations/*.sql; do
            psql -h localhost -U namastepos "$MIGRATION_TEST_DB" -f "$f"
          done
          # Re-run idempotent
          for f in db/migrations/*.sql; do
            psql -h localhost -U namastepos "$MIGRATION_TEST_DB" -f "$f"
          done

      - name: Lint backend
        working-directory: namastepos_backend
        run: npm run lint   # blocking: eslint --max-warnings 0

      - name: Run backend tests
        working-directory: namastepos_backend
        # timeout + --forceExit: a leaked handle after a failure must never
        # hang the job for hours (2026-08-24 — a run sat 54 min before cancel).
        timeout-minutes: 10
        run: npx jest --runInBand --forceExit

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: namastepos_dashboard/package-lock.json }
      - name: Install dashboard
        working-directory: namastepos_dashboard
        run: npm ci
      - name: Type-check dashboard
        working-directory: namastepos_dashboard
        run: npx tsc --noEmit -p .
      - name: Build dashboard
        working-directory: namastepos_dashboard
        run: npm run build

  # 2026-09-04: CI covered only backend + dashboard, so the admin console and
  # the entire Flutter app — the client most restaurants actually run — could
  # break on main without anyone noticing. Both are now gated.
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: namastepos_admin/package-lock.json }
      - name: Install admin
        working-directory: namastepos_admin
        run: npm ci
      - name: Type-check admin
        working-directory: namastepos_admin
        run: npx tsc --noEmit -p .
      - name: Build admin
        working-directory: namastepos_admin
        run: npm run build

  # 2026-09-04 — this job failed on EVERY push since it was made blocking, and
  # the reason was version skew, not the code: `channel: stable` installs
  # whatever stable is on the day, which was months newer than the 3.44.0 on
  # the dev machine. So `flutter analyze` was clean locally and failed in CI on
  # findings the older analyzer does not have (including a genuine
  # unchecked-nullable error in the reprint path). Two consequences:
  #   1. The gate is now PINNED to the same version used locally, so "clean on
  #      my machine" and "green in CI" mean the same thing, and an upstream
  #      stable release can no longer break main overnight.
  #   2. Newer findings are not thrown away — the `mobile-next` job below runs
  #      the same analysis on latest stable as an early warning that cannot
  #      block a deploy. When it complains, fix the code and bump the pin
  #      together, deliberately.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.44.0', cache: true }
      - name: Fetch packages
        working-directory: namastepos_flutter
        run: flutter pub get
      - name: Analyze (blocking)
        working-directory: namastepos_flutter
        run: flutter analyze
      - name: Unit tests
        working-directory: namastepos_flutter
        # `|| true` deliberately absent — but a repo with no test/ dir exits 1,
        # so only run when tests exist.
        run: |
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' -print -quit)" ]; then
            flutter test
          else
            echo "No Flutter tests yet — analyze is the gate."
          fi
      # android/app/build.gradle deliberately THROWS on a release build when
      # android/key.properties is absent, so a debug-signed APK can never be
      # shipped by accident. key.properties and *.jks are gitignored, so the
      # real upload key is not here and must not be — which means the previous
      # `flutter build apk --release` step could never have passed, in any run.
      # Rather than weaken the guard, give CI a THROWAWAY key of its own: the
      # release path (R8/minify, shrinkResources, manifest merge, proguard
      # rules) is exercised for real, and the resulting APK is signed with a
      # keystore that exists for 5 minutes inside one runner and is not usable
      # for distribution or for updating an installed app.
      # 2026-09-04, repo went PRIVATE: Actions minutes are now metered (2,000/mo
      # on Free), and this step alone is ~8 min of R8/shrink per push — about
      # 10 pushes a day would eat the whole monthly budget. `analyze` catches
      # Dart errors on every push, which is the fast, high-yield gate; a full
      # signed release build only needs to pass before an actual release, so it
      # runs on tags and on manual dispatch.
      - name: Generate a throwaway signing key (CI artifact only)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        working-directory: namastepos_flutter/android
        run: |
          keytool -genkeypair -v -noprompt \
            -keystore "$RUNNER_TEMP/ci-throwaway.p12" \
            -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 30 \
            -alias ci -storepass cicicicici -keypass cicicicici \
            -dname "CN=NamastePOS CI, OU=CI, O=NamastePOS, L=Pune, S=MH, C=IN"
          # printf, not a heredoc: an indented heredoc inside `run: |` writes
          # the leading spaces into the file too.
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/ci-throwaway.p12" cicicicici ci cicicicici > key.properties
          echo "--- key.properties (throwaway):" && cat key.properties
      # No --no-shrink: shrinking is what a real release does, and a missing
      # proguard keep rule only ever shows up here.
      - name: Build APK (release, throwaway signature)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        working-directory: namastepos_flutter
        run: flutter build apk --release

  # Early warning only — never blocks a deploy. Tells us what the NEXT Flutter
  # upgrade will demand, before we take it.
  mobile-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Flutter version under test
        run: flutter --version
      - name: Fetch packages
        working-directory: namastepos_flutter
        run: flutter pub get
      - name: Analyze on latest stable (advisory)
        working-directory: namastepos_flutter
        run: flutter analyze
