# Keeps the Render free-tier API awake (it sleeps after 15 min idle).
# Pings /health every 10 minutes; costs ~75 GitHub Actions minutes/month.
# Remove this workflow when the API moves to an always-on host.
name: API keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping API health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://namastepos-api.onrender.com/health)
          echo "health returned $code"
          test "$code" = "200"
