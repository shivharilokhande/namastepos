# NamastePOS — Postgres tuning for a 4GB / 2-vCPU launch VM.
#
# Drop into /etc/postgresql/15/main/postgresql.conf (or use ALTER SYSTEM
# for each key) then `systemctl restart postgresql`. Verify with:
#     psql -c 'SHOW max_connections; SHOW shared_buffers;'
#
# Assumes Postgres has ~50-70% of a 4GB VM's RAM available (the rest
# goes to Node cluster + nginx + Redis).

# ── Concurrency ─────────────────────────────────────────────────────
# Node cluster × DB_POOL_MAX must stay under this. On a 2-vCPU box with
# PM2 spawning 2 workers × DB_POOL_MAX=50 = 100 sockets. Leave headroom
# for scheduled jobs + support psql sessions.
max_connections = 200

# ── Memory ──────────────────────────────────────────────────────────
# 25% of RAM is the classic rule.
shared_buffers = 1GB

# OS + kernel page cache benefit. Postgres uses this hint to plan
# whether index scans are worth it.
effective_cache_size = 2500MB

# Per-operation working memory. With ~50 concurrent queries you want
# this small — 4MB × 50 = 200MB worst case.
work_mem = 4MB

# Big enough for CREATE INDEX + VACUUM without swapping.
maintenance_work_mem = 128MB

# ── Write-ahead log ─────────────────────────────────────────────────
wal_buffers = 16MB
checkpoint_completion_target = 0.9
min_wal_size = 128MB
max_wal_size = 1GB

# ── SSD tuning ──────────────────────────────────────────────────────
# SSDs have no seek penalty; default 4.0 makes the planner avoid
# indexes it should use. 1.1 is the widely-published SSD value.
random_page_cost = 1.1
effective_io_concurrency = 200

# ── Logging (only slow-query capture on prod) ──────────────────────
log_min_duration_statement = 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on

# ── Statement timeout (bounded queries) ────────────────────────────
# Nothing in our workload should legitimately run > 30s. If an admin
# report needs longer, they can `SET LOCAL statement_timeout` inside
# the transaction.
statement_timeout = '30s'
lock_timeout = '5s'
idle_in_transaction_session_timeout = '60s'

# ── Autovacuum (busier than default because we churn `orders`) ─────
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
