# NamastePOS — nginx reverse-proxy / static hosting for namastepos.in
# (added 2026-08-24 after the domain purchase).
#
# DNS records to create at Hostinger (hPanel > Domains > namastepos.in > DNS):
#   A     @        <server-ip>        (landing page)
#   A     app      <server-ip>        (tenant dashboard)
#   A     admin    <server-ip>        (super-admin panel)
#   A     api      <server-ip>        (backend)
#   CNAME www      namastepos.in
#   A     *        <server-ip>        (wildcard — needed for <brand>.namastepos.in tenant sites)
#
# TLS: after DNS resolves, on the server run
#   certbot --nginx -d namastepos.in -d www.namastepos.in -d app.namastepos.in \
#     -d admin.namastepos.in -d api.namastepos.in
#   (the wildcard *.namastepos.in cert needs certbot's DNS-01 challenge —
#    use the Hostinger DNS API plugin or add the TXT record manually.)
# Certbot rewrites these blocks to add the ssl config + port-80 redirects.

# ── API ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.namastepos.in;

    client_max_body_size 10m;          # menu image uploads

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # webhook signature check rebuilds the URL from this
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}

# ── Tenant dashboard (static Vite build) ──────────────────────────────
server {
    listen 80;
    server_name app.namastepos.in;
    root /var/www/namastepos/dashboard;   # namastepos_dashboard/dist
    index index.html;
    location / { try_files $uri /index.html; }   # SPA routing
}

# ── Super-admin panel ──────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.namastepos.in;
    root /var/www/namastepos/admin;       # namastepos_admin/dist
    index index.html;
    location / { try_files $uri /index.html; }
}

# ── Landing page + tenant brand sites ──────────────────────────────────
server {
    listen 80;
    server_name namastepos.in www.namastepos.in;
    root /var/www/namastepos/landing;     # namastepos_landing/
    index index.html;
}

# <brand>.namastepos.in — tenant online-ordering sites are served by the
# backend (/v1/site/:slug), so wildcard subdomains proxy to the API.
server {
    listen 80;
    server_name ~^(?<brand>[a-z0-9-]+)\.namastepos\.in$;

    location / {
        proxy_pass http://127.0.0.1:4000/v1/site/$brand;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
